name: Fork release

# Fork-only pipeline: builds a release candidate and attaches it to a GitHub
# release without touching npm or the upstream repository. The upstream
# `publish.yml` skips forks on purpose, so this workflow covers local testing.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (vX.Y.Z or vX.Y.Z-rc.N)
        required: true
        type: string
      build_container:
        description: Also build and push the container image to GHCR
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: fork-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  package:
    name: Checks, package and GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.release.outputs.version }}
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}
    steps:
      - name: Validate requested release tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-rc\.[0-9]+)?$ ]]; then
            VERSION="${BASH_REMATCH[1]}${BASH_REMATCH[2]}"
          else
            echo "Invalid release tag: $RELEASE_TAG (expected vX.Y.Z or vX.Y.Z-rc.N)" >&2
            exit 1
          fi

          IS_PRERELEASE=false
          if [[ "$VERSION" == *-rc.* ]]; then
            IS_PRERELEASE=true
          fi

          {
            echo "version=$VERSION"
            echo "is_prerelease=$IS_PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck, build and test
        run: |
          npm run lint
          npm run typecheck
          npm run build
          npm run test

      - name: Verify package version matches tag
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [[ "$PACKAGE_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "Tag version $EXPECTED_VERSION does not match package.json version $PACKAGE_VERSION" >&2
            exit 1
          fi

      - name: Pack the package
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          IS_PRERELEASE: ${{ steps.release.outputs.is_prerelease }}
        run: |
          set -euo pipefail

          TGZ=$(ls "$RUNNER_TEMP"/*.tgz | head -1)
          NOTES="docs/release-notes/v${VERSION}.md"

          # Prefer curated release notes committed with the version bump.
          if [[ ! -f "$NOTES" ]]; then
            node scripts/generate-release-notes.mjs \
              --version "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --output "$RUNNER_TEMP/release-notes.md"
            NOTES="$RUNNER_TEMP/release-notes.md"
          fi

          ARGS=(--title "$TAG" --notes-file "$NOTES")
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            ARGS+=(--prerelease)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" "${ARGS[@]}"
            gh release upload "$TAG" "$TGZ" --clobber
          else
            gh release create "$TAG" "$TGZ" "${ARGS[@]}"
          fi

          gh release view "$TAG" --json url,assets --jq '{url: .url, assets: [.assets[].name]}'

  container:
    name: Container image
    needs: package
    if: inputs.build_container
    uses: ./.github/workflows/container-image.yml
    with:
      tag: ${{ inputs.tag }}
      publish_latest: ${{ needs.package.outputs.is_prerelease == 'false' }}
    permissions:
      contents: read
      packages: write
